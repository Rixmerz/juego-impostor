# Blueprint de Render. En el dashboard: New → Blueprint → apunta a este repo.
# Render inyecta PORT y RENDER_EXTERNAL_URL solo; no hay que configurarlos a mano.
services:
  - type: web
    name: juego-impostor
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
